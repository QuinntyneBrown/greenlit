<gl-skip-link />
@if (shell() === 'app') {
  <gl-top-bar>
    <gl-app-nav [items]="mainNav()" />
    @if (accountState.signedIn()) {
      <gl-user-menu
        slot="end"
        [name]="accountState.account()?.displayName ?? null"
        [detail]="accountState.detail()"
        (signOut)="signOut()"
      />
    }
  </gl-top-bar>
}
<!--
  One outlet, always mounted. Toggling classes (rather than switching between
  outlet branches) keeps the routed component alive when the shell data
  changes on NavigationEnd.
-->
<main
  id="main"
  class="gl-frame"
  [class.shell]="shell() === 'app'"
  [class.gl-frame--bare]="shell() === 'bare'"
>
  <router-outlet />
</main>
<app-toast-outlet />

name: CI

# Runs the same gates on every pull request and on pushes to non-main
# branches, so a merge to main never meets a red suite. The deploy workflow
# (when hosting lands) reruns these before anything reaches an environment.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.101'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NODE_VERSION: '22'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend tests
    # The API and Infrastructure tests run on in-memory SQLite, so the job
    # needs no database server and runs on Linux like the others.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Builds once, then runs the test assemblies side by side instead of
      # one after another (see the script for why that is safe).
      - name: Build and test
        shell: pwsh
        run: ./eng/Test-Backend.ps1 -Configuration Release

  test-frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular workspace deps
        working-directory: frontend
        run: npm ci

      - name: Format check (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Lint (angular-eslint)
        working-directory: frontend
        run: npm run lint

      - name: Build libraries
        working-directory: frontend
        run: |
          npx ng build api
          npx ng build components

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test -- --watch=false

      - name: ng build (production)
        working-directory: frontend
        run: |
          npx ng build greenlit --configuration production
          npx ng build marketing --configuration production

  e2e:
    name: Playwright behaviour tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install Angular workspace deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the API and CLI
        run: dotnet build backend/Greenlit.sln --nologo

      - name: Start the e2e API (SQLite, seeded)
        shell: pwsh
        run: ./eng/Start-E2eApi.ps1

      - name: Behaviour tests (Chromium)
        working-directory: e2e
        run: npm run test:behavior

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: e2e/test-results/

name: Deploy

# Every push to main publishes both Angular applications to Azure Static Web Apps
# (ADR-010): the marketing site (www.greenlit.rocks, once DNS points at it) and
# the Greenlit app (app.greenlit.rocks); and the API to the Free Linux App Service
# app-greenlit-api-prod after migrating the Azure SQL database (ADR-011). The gates
# run first so a red build never reaches an environment. Run it by hand to
# republish current main.
#
# Secrets: AZURE_SWA_TOKEN_WWW and AZURE_SWA_TOKEN_APP, the deployment tokens of
# swa-greenlit-www-prod and swa-greenlit-app-prod in rg-greenlit-prod
# (`az staticwebapp secrets list -g rg-greenlit-prod -n <name> --query properties.apiKey -o tsv`);
# AZURE_CREDENTIALS, the service principal sp-greenlit-github-deploy (Contributor on
# rg-greenlit-prod); AZURE_SQL_CONNECTION, the greenlit database's connection string.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  DOTNET_VERSION: '10.0.101'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  RESOURCE_GROUP: rg-greenlit-prod
  SQL_SERVER: sql-greenlit-cc-prod
  API_APP: app-greenlit-api-prod

jobs:
  build:
    name: Build both applications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Format and lint
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint
      - name: Build (production)
        working-directory: frontend
        run: |
          npx ng build marketing --configuration production
          npx ng build greenlit --configuration production
      - uses: actions/upload-artifact@v4
        with:
          name: marketing
          path: frontend/dist/marketing/browser
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: greenlit
          path: frontend/dist/greenlit/browser
          if-no-files-found: error

  deploy-www:
    name: Deploy the marketing site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-www
      url: https://purple-meadow-0272bdd0f.5.azurestaticapps.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marketing
          path: site
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_WWW }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

  deploy-app:
    name: Deploy the Greenlit app
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-app
      url: https://gentle-wave-0f947aa0f.4.azurestaticapps.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: greenlit
          path: site
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_APP }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

  build-api:
    name: Build the API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish (Release, linux-x64, framework-dependent)
        working-directory: backend
        run: dotnet publish src/Greenlit.Api -c Release -o publish/api --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: backend/publish/api
          if-no-files-found: error

  deploy-api:
    name: Migrate the database and deploy the API
    needs: [build-api, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-api
      url: https://app-greenlit-api-prod.azurewebsites.net/api/_ping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: api
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Let this runner reach the database
        id: firewall
        run: |
          ip=$(curl -s https://api.ipify.org)
          rule="github-run-${{ github.run_id }}"
          az sql server firewall-rule create -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "$rule" --start-ip-address "$ip" --end-ip-address "$ip" -o none
          echo "rule=$rule" >> "$GITHUB_OUTPUT"
      - name: Apply pending migrations (greenlit migrate)
        working-directory: backend
        env:
          GREENLIT_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION }}
        run: dotnet run --project src/Greenlit.Cli -c Release -- migrate --provider SqlServer
      - name: Close the firewall again
        if: always() && steps.firewall.outputs.rule != ''
        run: az sql server firewall-rule delete -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "${{ steps.firewall.outputs.rule }}" -o none
      - name: Deploy the API
        run: |
          (cd api && zip -qr ../api.zip .)
          az webapp deploy -g "$RESOURCE_GROUP" -n "$API_APP" --src-path api.zip --type zip --clean true --restart true -o none
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"mode":"ok"}' "https://$API_APP.azurewebsites.net/api/_ping")
            [ "$code" = "200" ] && echo "API is up" && exit 0
            sleep 15
          done
          echo "::error::The API did not answer on /api/_ping within five minutes"; exit 1

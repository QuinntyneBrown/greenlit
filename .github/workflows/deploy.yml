name: Deploy

# Every push to main publishes both Angular applications to Azure Static Web Apps
# (ADR-010): the marketing site (www.greenlit.rocks, once DNS points at it) and
# the Greenlit app (app.greenlit.rocks). The frontend gates run first so a red
# build never reaches an environment. Run it by hand to republish current main.
#
# Secrets: AZURE_SWA_TOKEN_WWW and AZURE_SWA_TOKEN_APP, the deployment tokens of
# swa-greenlit-www-prod and swa-greenlit-app-prod in rg-greenlit-prod
# (`az staticwebapp secrets list -g rg-greenlit-prod -n <name> --query properties.apiKey -o tsv`).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build both applications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Format and lint
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint
      - name: Build (production)
        working-directory: frontend
        run: |
          npx ng build marketing --configuration production
          npx ng build greenlit --configuration production
      - uses: actions/upload-artifact@v4
        with:
          name: marketing
          path: frontend/dist/marketing/browser
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: greenlit
          path: frontend/dist/greenlit/browser
          if-no-files-found: error

  deploy-www:
    name: Deploy the marketing site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-www
      url: https://purple-meadow-0272bdd0f.5.azurestaticapps.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marketing
          path: site
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_WWW }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

  deploy-app:
    name: Deploy the Greenlit app
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-app
      url: https://gentle-wave-0f947aa0f.4.azurestaticapps.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: greenlit
          path: site
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_APP }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true
